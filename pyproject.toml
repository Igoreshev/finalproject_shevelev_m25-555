[tool.poetry]
name = "finalproject-shevelev-m25-555"
version = "0.1.0"
description = "Консольное приложение для работы с валютами и портфелями"
authors = ["Shevelev <wer.28091@yandex.ru>"]
readme = "README.md"

packages = [{ include = "valutatrade_hub" }]

[tool.poetry.dependencies]
python = ">=3.12"
requests = "^2.32.5"

[tool.poetry.scripts]
project = "valutatrade_hub.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ruff (>=0.14.10,<0.15.0)"
]
